<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://eizpxgwkottliyvvhlar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8ETbP5HwW3wZmWjlQQQu0Q_IMBPdfl7";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let selectedNumbers = [];
let isDrawing = false;


/* =========================
   AUTH
========================= */

async function register(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    show("authMessage","Enter email and password.");
    return;
  }

  const {error} =
    await supabaseClient.auth.signUp({email,password});

  if(error){
    show("authMessage",error.message);
    return;
  }

  show("authMessage","Registration successful.");
}


async function login(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    show("authMessage","Enter email and password.");
    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    show("authMessage",error.message);
    return;
  }

  currentUser = data.user;
  await startApp();
}


async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  document.getElementById("app").classList.add("hidden");
  document.getElementById("authBox").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.add("hidden");
}


/* =========================
   START APP
========================= */

async function startApp(){

  document.getElementById("authBox").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.remove("hidden");

  createNumbers();

  await loadBalance();
  await loadDeposits();
  await checkAdmin();
}


/* =========================
   BALANCE
========================= */

async function loadBalance(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id",currentUser.id)
      .single();

  if(error){
    console.log(error);
    return;
  }

  document.getElementById("balance").textContent =
    Number(data?.balance || 0).toFixed(2) + " ETB";
}


/* =========================
   DEPOSIT
========================= */

async function makeDeposit(){

  if(!currentUser){
    show("depositMessage","Please login first.");
    return;
  }

  const amount =
    Number(document.getElementById("depositAmount").value);

  const method =
    document.getElementById("depositMethod").value;

  const reference =
    document.getElementById("depositReference").value.trim();

  if(!amount || amount <= 0){
    show("depositMessage","Enter a valid amount.");
    return;
  }

  if(!reference){
    show("depositMessage","Enter transaction reference.");
    return;
  }

  const {error} =
    await supabaseClient
      .from("deposits")
      .insert({
        user_id:currentUser.id,
        amount:amount,
        method:method,
        reference:reference,
        status:"pending"
      });

  if(error){
    show("depositMessage",error.message);
    return;
  }

  show(
    "depositMessage",
    "Deposit submitted. Waiting for admin approval."
  );

  document.getElementById("depositAmount").value="";
  document.getElementById("depositReference").value="";

  await loadDeposits();
}


/* =========================
   USER DEPOSITS
========================= */

async function loadDeposits(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("deposits")
      .select("*")
      .eq("user_id",currentUser.id)
      .order("created_at",{ascending:false});

  if(error){
    console.log(error);
    return;
  }

  const list =
    document.getElementById("depositList");

  list.innerHTML="";

  (data || []).forEach(item=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${Number(item.amount).toFixed(2)} ETB</td>
      <td>${item.method || ""}</td>
      <td class="${item.status || ""}">
        ${item.status || "pending"}
      </td>
    `;

    list.appendChild(tr);
  });
}


/* =========================
   ADMIN
========================= */

async function checkAdmin(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id",currentUser.id)
      .single();

  if(error){
    console.log(error);
    return;
  }

  if(data?.role === "admin"){

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");

    await loadAdminDeposits();
  }
}


async function loadAdminDeposits(){

  const {data,error} =
    await supabaseClient
      .from("deposits")
      .select("*")
      .eq("status","pending")
      .order("created_at",{ascending:false});

  if(error){
    console.log(error);
    return;
  }

  const list =
    document.getElementById("adminDeposits");

  list.innerHTML="";

  (data || []).forEach(item=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${item.user_id}</td>
      <td>${Number(item.amount).toFixed(2)} ETB</td>
      <td>${item.method || ""}</td>
      <td class="pending">pending</td>
      <td>

        <button
          onclick="approveDeposit(
            '${item.id}',
            ${Number(item.amount)},
            '${item.user_id}'
          )">
          APPROVE
        </button>

        <button
          class="danger"
          onclick="rejectDeposit('${item.id}')">
          REJECT
        </button>

      </td>
    `;

    list.appendChild(tr);
  });
}


/* =========================
   APPROVE
========================= */

async function approveDeposit(
  depositId,
  amount,
  userId
){

  const {error:updateError} =
    await supabaseClient
      .from("deposits")
      .update({status:"approved"})
      .eq("id",depositId);

  if(updateError){
    alert(updateError.message);
    return;
  }

  const {data:profile,error:profileError} =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id",userId)
      .single();

  if(profileError){
    alert(profileError.message);
    return;
  }

  const newBalance =
    Number(profile.balance || 0) +
    Number(amount);

  const {error:balanceError} =
    await supabaseClient
      .from("profiles")
      .update({balance:newBalance})
      .eq("id",userId);

  if(balanceError){
    alert(balanceError.message);
    return;
  }

  alert("Deposit approved successfully.");

  await loadAdminDeposits();
}


/* =========================
   REJECT
========================= */

async function rejectDeposit(id){

  if(!confirm("Reject this deposit?")) return;

  const {error} =
    await supabaseClient
      .from("deposits")
      .update({status:"rejected"})
      .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  alert("Deposit rejected.");

  await loadAdminDeposits();
}


/* =========================
   KENO NUMBERS
========================= */

function createNumbers(){

  const grid =
    document.getElementById("numberGrid");

  grid.innerHTML="";
  selectedNumbers=[];

  for(let i=1;i<=80;i++){

    const button =
      document.createElement("button");

    button.className="num";
    button.textContent=i;

    button.onclick=()=>{

      if(isDrawing) return;

      if(selectedNumbers.includes(i)){

        selectedNumbers =
          selectedNumbers.filter(n=>n!==i);

        button.classList.remove("selected");

      }else{

        if(selectedNumbers.length >= 10){

          alert("Maximum 10 numbers.");
          return;
        }

        selectedNumbers.push(i);
        button.classList.add("selected");
      }
    };

    grid.appendChild(button);
  }
}


/* =========================
   KENO DRAW ANIMATION
========================= */

async function playKeno(){

  if(isDrawing) return;

  if(!currentUser){
    show("gameMessage","Please login first.");
    return;
  }

  const bet =
    Number(document.getElementById("betAmount").value);

  if(!bet || bet <= 0){
    show("gameMessage","Enter bet amount.");
    return;
  }

  if(selectedNumbers.length < 1){
    show("gameMessage","Select at least one number.");
    return;
  }

  const {data:profile,error} =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id",currentUser.id)
      .single();

  if(error){
    show("gameMessage",error.message);
    return;
  }

  if(Number(profile.balance || 0) < bet){
    show("gameMessage","Insufficient balance.");
    return;
  }

  isDrawing=true;

  show("gameMessage","🎰 DRAWING...");

  const winningNumbers=[];

  while(winningNumbers.length < 10){

    const n =
      Math.floor(Math.random()*80)+1;

    if(!winningNumbers.includes(n)){
      winningNumbers.push(n);
    }
  }

  /*
     DRAW ANIMATION
  */

  for(let i=0;i<winningNumbers.length;i++){

    show(
      "gameMessage",
      "🎱 Drawing number " +
      (i+1) +
      "/10 ..."
    );

    await wait(700);

    show(
      "gameMessage",
      "🎱 Number: " +
      winningNumbers[i]
    );

    await wait(400);
  }

  const hits =
    selectedNumbers.filter(
      n=>winningNumbers.includes(n)
    ).length;


  /*
     SIMPLE PAYOUT TABLE
  */

  const multipliers = {

    0:0,
    1:0,
    2:1,
    3:2,
    4:5,
    5:10,
    6:20,
    7:50,
    8:100,
    9:250,
    10:500

  };

  const multiplier =
    multipliers[hits] || 0;

  const payout =
    bet * multiplier;

  const finalBalance =
    Number(profile.balance) -
    bet +
    payout;


  /*
     UPDATE BALANCE
  */

  const {error:balanceError} =
    await supabaseClient
      .from("profiles")
      .update({
        balance:finalBalance
      })
      .eq("id",currentUser.id);

  if(balanceError){

    show(
      "gameMessage",
      balanceError.message
    );

    isDrawing=false;
    return;
  }


  /*
     RESULT
  */

  show(
    "gameMessage",

    "🏆 Winning Numbers: " +
    winningNumbers.join(", ") +

    " | Hits: " +
    hits +

    " | Payout: " +
    payout.toFixed(2) +
    " ETB"
  );

  await loadBalance();

  isDrawing=false;
}


/* =========================
   WAIT
========================= */

function wait(ms){

  return new Promise(
    resolve=>setTimeout(resolve,ms)
  );
}


/* =========================
   MESSAGE
========================= */

function show(id,message){

  const element =
    document.getElementById(id);

  if(element){
    element.textContent=message;
  }
}


/* =========================
   AUTO LOGIN
========================= */

(async function(){

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){

    currentUser =
      data.session.user;

    await startApp();
  }

})();

</script>

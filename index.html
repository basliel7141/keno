<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KENO Gaming</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#070b12;
 color:white;
}

.container{
 max-width:1000px;
 margin:auto;
 padding:15px;
}

header{
 display:flex;
 justify-content:flex-end;
 align-items:center;
 padding:10px 0;
 border-bottom:1px solid #263044;
}

.card{
 background:#111827;
 border:1px solid #263044;
 border-radius:16px;
 padding:18px;
 margin-top:18px;
}

.hidden{display:none!important}

input,select,button{
 width:100%;
 padding:13px;
 margin:6px 0;
 border-radius:9px;
 border:1px solid #344054;
 font-size:15px;
}

input,select{
 background:#0b1220;
 color:white;
}

button{
 background:#20c878;
 color:#04120b;
 font-weight:bold;
 border:0;
 cursor:pointer;
}

button:hover{opacity:.9}

button:disabled{
 opacity:.5;
 cursor:not-allowed;
}

.secondary{
 background:#263044;
 color:white;
}

.danger{
 background:#dc3545;
 color:white;
}

.row{
 display:flex;
 gap:10px;
}

.row>*{flex:1}

.status{
 background:#182235;
 padding:10px;
 border-radius:8px;
 margin-top:8px;
 min-height:20px;
}

.success{color:#36e38b}
.error{color:#ff6b6b}
.small{
 color:#9ca3af;
 font-size:13px;
}

.balance-card{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
}

.balance{
 font-size:30px;
 font-weight:bold;
 color:#36e38b;
}

.games-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.games-grid{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:10px;
 margin-top:15px;
}

.game-card{
 background:#0b1220;
 border:1px solid #263044;
 border-radius:12px;
 padding:10px;
 min-width:0;
}

.game-icon{
 font-size:32px;
 margin-bottom:5px;
 text-align:center;
}

.game-name{
 font-size:15px;
 font-weight:bold;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.game-description{
 color:#9ca3af;
 font-size:11px;
 margin:5px 0 8px;
 line-height:1.35;
 min-height:30px;
}

.game-card button{
 font-size:11px;
 padding:8px 5px;
 margin:3px 0;
}

.details-box{
 background:#0b1220;
 border-radius:12px;
 padding:15px;
 margin-top:10px;
}

.number-grid{
 display:grid;
 grid-template-columns:repeat(10,1fr);
 gap:6px;
 margin-top:15px;
}

.num{
 background:#182235;
 color:white;
 border:1px solid #344054;
 padding:10px 0;
 margin:0;
}

.num.selected{
 background:#20c878;
 color:#06130b;
}

.result-numbers{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:12px;
}

.result-ball{
 width:42px;
 height:42px;
 border-radius:50%;
 display:flex;
 justify-content:center;
 align-items:center;
 background:#263044;
 color:white;
 font-weight:bold;
}

.result-ball.hit{
 background:#20c878;
 color:#06130b;
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:10px;
}

th,td{
 padding:9px 5px;
 border-bottom:1px solid #263044;
 text-align:left;
 font-size:13px;
}

.pending{color:#ffd166}
.approved{color:#36e38b}
.rejected{color:#ff6b6b}

.top-actions{
 display:flex;
 align-items:center;
 gap:8px;
}

.deposit-top{
 width:auto!important;
 margin:0!important;
 padding:9px 15px!important;
 border-radius:9px!important;
 font-size:14px!important;
 white-space:nowrap;
}

/* LUDO */

.ludo-board-wrap{
 margin-top:15px;
 display:flex;
 justify-content:center;
}

.ludo-board{
 width:min(92vw,520px);
 aspect-ratio:1/1;
 display:grid;
 grid-template-columns:repeat(15,1fr);
 grid-template-rows:repeat(15,1fr);
 background:#f5f5f5;
 border:5px solid #263044;
 border-radius:12px;
 overflow:hidden;
}

.ludo-cell{
 border:1px solid #d5d9df;
 position:relative;
 display:flex;
 align-items:center;
 justify-content:center;
}

.ludo-safe{background:#dbeafe}

.ludo-center{
 background:conic-gradient(
 #ff7676 0 25%,
 #6ee7a8 0 50%,
 #ffe66d 0 75%,

 );
}

.ludo-home{
 z-index:3;
 display:grid;
 grid-template-columns:1fr 1fr;
 grid-template-rows:1fr 1fr;
 padding:10px;
 gap:8px;
 border:2px solid #111827;
}

.ludo-home.red{background:#ff7676}
.ludo-home.green{background:#6ee7a8}
.ludo-home.yellow{background:#ffe66d}
.ludo-home.blue{background:#74a7ff}

.ludo-yard{
 background:rgba(255,255,255,.85);
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
}

.ludo-pawn{
 width:65%;
 aspect-ratio:1;
 border-radius:50%;
 border:2px solid #111827;
 box-shadow:0 2px 4px #0005;
 cursor:pointer;
}

.ludo-pawn.red{background:#ef4444}
.ludo-pawn.green{background:#22c55e}
.ludo-pawn.yellow{background:#eab308}
.ludo-pawn.blue{background:#3b82f6}

.ludo-controls{
 display:flex;
 gap:10px;
 align-items:center;
 margin-top:12

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KENO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#070b12;
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #263044;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#36e38b;
}

.card{
  background:#111827;
  border:1px solid #263044;
  border-radius:16px;
  padding:20px;
  margin-top:20px;
}

h2{margin-top:0}

input,select,button{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #344054;
  font-size:15px;
}

input,select{
  background:#0b1220;
  color:white;
}

button{
  background:#20c878;
  color:#04120b;
  font-weight:bold;
  border:0;
  cursor:pointer;
}

button:hover{opacity:.9}

.danger{
  background:#dc3545;
  color:white;
}

.secondary{
  background:#263044;
  color:white;
}

.hidden{
  display:none!important;
}

.balance{
  font-size:32px;
  font-weight:bold;
  color:#36e38b;
}

.status{
  padding:10px;
  border-radius:8px;
  background:#182235;
  margin-top:10px;
  line-height:1.5;
}

.number-grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:7px;
  margin-top:15px;
}

.num{
  background:#182235;
  color:white;
  border:1px solid #344054;
  padding:10px 0;
}

.num.selected{
  background:#20c878;
  color:#06130b;
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:10px 6px;
  border-bottom:1px solid #263044;
  text-align:left;
  font-size:13px;
}

.pending{color:#ffd166}
.approved{color:#36e38b}
.rejected{color:#ff6b6b}

.small{
  color:#9ca3af;
  font-size:13px;
}

/* KENO DRAW */
.draw-box{
  background:#070b12;
  border:1px solid #344054;
  border-radius:16px;
  padding:20px;
  margin-top:15px;
  text-align:center;
}

.draw-title{
  color:#9ca3af;
  font-size:13px;
  margin-bottom:10px;
}

.draw-number{
  font-size:64px;
  font-weight:bold;
  color:#36e38b;
  min-height:75px;
}

.draw-history{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:15px;
}

.draw-ball{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#263044;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.result-box{
  margin-top:15px;
  padding:15px;
  background:#0b1220;
  border-radius:10px;
  border:1px solid #344054;
}

@media(max-width:600px){

  .container{
    padding:12px;
  }

  .number-grid{
    grid-template-columns:repeat(8,1fr);
  }

  .draw-number{
    font-size:50px;
  }

  .row{
    flex-direction:column;
    gap:0;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo">KENO</div>

  <button
    id="logoutBtn"
    class="secondary hidden"
    onclick="logout()">
    Logout
  </button>
</header>


<!-- AUTH -->

<div id="authBox" class="card">

  <h2>Login / Register</h2>

  <input
    id="email"
    type="email"
    placeholder="Email">

  <input
    id="password"
    type="password"
    placeholder="Password">

  <div class="row">

    <button onclick="login()">
      Login
    </button>

    <button
      class="secondary"
      onclick="register()">
      Register
    </button>

  </div>

  <div
    id="authMessage"
    class="status">
  </div>

</div>


<!-- APP -->

<div id="app" class="hidden">


<!-- BALANCE -->

<div class="card">

  <div class="small">
    Your Balance
  </div>

  <div
    class="balance"
    id="balance">
    0.00 ETB
  </div>

</div>


<!-- DEPOSIT -->

<div class="card">

  <h2>Deposit</h2>

  <input
    id="depositAmount"
    type="number"
    placeholder="Amount (ETB)">

  <select id="depositMethod">

    <option value="Telebirr">
      Telebirr
    </option>

    <option value="CBE Birr">
      CBE Birr
    </option>

    <option value="Bank">
      Bank
    </option>

  </select>

  <input
    id="depositReference"
    placeholder="Transaction / Reference number">

  <button onclick="makeDeposit()">
    Submit Deposit
  </button>

  <div
    id="depositMessage"
    class="status">
  </div>

</div>


<!-- DEPOSIT HISTORY -->

<div class="card">

  <h2>My Deposits</h2>

  <table>

    <thead>

      <tr>
        <th>Amount</th>
        <th>Method</th>
        <th>Status</th>
      </tr>

    </thead>

    <tbody id="depositList"></tbody>

  </table>

</div>


<!-- KENO -->

<div class="card">

  <h2>KENO</h2>

  <div class="small">
    Select up to 10 numbers
  </div>


  <!-- DRAW SCREEN -->

  <div class="draw-box">

    <div class="draw-title">
      KENO DRAW
    </div>

    <div
      id="drawNumber"
      class="draw-number">
      —
    </div>

    <div
      id="drawHistory"
      class="draw-history">
    </div>

  </div>


  <!-- NUMBERS -->

  <div
    id="numberGrid"
    class="number-grid">
  </div>


  <div
    class="row"
    style="margin-top:15px">

    <input
      id="betAmount"
      type="number"
      placeholder="Bet amount">

    <button
      id="playButton"
      onclick="playKeno()">
      PLAY
    </button>

  </div>


  <div
    id="gameMessage"
    class="status">
  </div>


  <div
    id="resultBox"
    class="result-box hidden">
  </div>

</div>


<!-- ADMIN -->

<div
  id="adminPanel"
  class="card hidden">

  <h2>Admin Panel</h2>

  <p class="small">
    Pending deposits
  </p>

  <table>

    <thead>

      <tr>
        <th>User</th>
        <th>Amount</th>
        <th>Method</th>
        <th>Status</th>
        <th>Action</th>
      </tr>

    </thead>

    <tbody id="adminDeposits"></tbody>

  </table>

</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://eizpxgwkottliyvvhlar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8ETbP5HwW3wZmWjlQQQu0Q_IMBPdfl7";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   GLOBAL
========================= */

let currentUser = null;
let selectedNumbers = [];
let isDrawing = false;


/* =========================
   MESSAGE
========================= */

function show(id,message){

  const element =
    document.getElementById(id);

  if(element){
    element.textContent = message;
  }
}


/* =========================
   WAIT
========================= */

function wait(ms){

  return new Promise(
    resolve => setTimeout(resolve,ms)
  );
}


/* =========================
   REGISTER
========================= */

async function register(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!email || !password){

    show(
      "authMessage",
      "Enter email and password."
    );

    return;
  }

  const {error} =
    await supabaseClient.auth.signUp({
      email:email,
      password:password
    });

  if(error){

    show(
      "authMessage",
      error.message
    );

    return;
  }

  show(
    "authMessage",
    "Registration successful."
  );
}


/* =========================
   LOGIN
========================= */

async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!email || !password){

    show(
      "authMessage",
      "Enter email and password."
    );

    return;
  }

  const {data,error} =
    await supabaseClient.auth.signInWithPassword({

      email:email,
      password:password

    });

  if(error){

    show(
      "authMessage",
      error.message
    );

    return;
  }

  currentUser = data.user;

  await startApp();
}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("authBox")
    .classList.remove("hidden");

  document
    .getElementById("logoutBtn")
    .classList.add("hidden");
}


/* =========================
   START APP
========================= */

async function startApp(){

  document
    .getElementById("authBox")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("logoutBtn")
    .classList.remove("hidden");

  createNumbers();

  await loadBalance();

  await loadDeposits();

  await checkAdmin();
}


/* =========================
   BALANCE
========================= */

async function loadBalance(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id",currentUser.id)
      .single();

  if(error){

    console.log(error);

    return;
  }

  const balance =
    Number(data?.balance || 0);

  document
    .getElementById("balance")
    .textContent =
    balance.toFixed(2) + " ETB";
}


/* =========================
   DEPOSIT
========================= */

async function makeDeposit(){

  if(!currentUser){

    show(
      "depositMessage",
      "Please login first."
    );

    return;
  }

  const amount =
    Number(
      document
        .getElementById("depositAmount")
        .value
    );

  const method =
    document
      .getElementById("depositMethod")
      .value;

  const reference =
    document
      .getElementById("depositReference")
      .value
      .trim();

  if(!amount || amount <= 0){

    show(
      "depositMessage",
      "Enter a valid amount."
    );

    return;
  }

  if(!reference){

    show(
      "depositMessage",
      "Enter transaction reference."
    );

    return;
  }

  const {error} =
    await supabaseClient
      .from("deposits")
      .insert({

        user_id:currentUser.id,

        amount:amount,

        method:method,

        reference:reference,

        status:"pending"

      });

  if(error){

    show(
      "depositMessage",
      error.message
    );

    return;
  }

  show(
    "depositMessage",
    "Deposit submitted. Waiting for admin approval."
  );

  document
    .getElementById("depositAmount")
    .value = "";

  document
    .getElementById("depositReference")
    .value = "";

  await loadDeposits();
}


/* =========================
   USER DEPOSITS
========================= */

async function loadDeposits(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("deposits")
      .select("*")
      .eq("user_id",currentUser.id)
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.log(error);

    return;
  }

  const list =
    document
      .getElementById("depositList");

  list.innerHTML = "";

  (data || []).forEach(item=>{

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        ${Number(item.amount).toFixed(2)} ETB
      </td>

      <td>
        ${item.method || ""}
      </td>

      <td class="${item.status || ""}">
        ${item.status || "pending"}
      </td>

    `;

    list.appendChild(tr);

  });
}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

  if(!currentUser) return;

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id",currentUser.id)
      .single();

  if(error){

    console.log(error);

    return;
  }

  if(data?.role === "admin"){

    document
      .getElementById("adminPanel")
      .classList
      .remove("hidden");

    await loadAdminDeposits();
  }
}


/* =========================
   ADMIN DEPOSITS
========================= */

async function loadAdminDeposits(){

  const {data,error} =
    await supabaseClient
      .from("deposits")
      .select("*")
      .eq("status","pending")
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.log(error);

    return;
  }

  const list =
    document
      .getElementById("adminDeposits");

  list.innerHTML = "";

  (data || []).forEach(item=>{

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        ${item.user_id}
      </td>

      <td>
        ${Number(item.amount).toFixed(2)} ETB
      </td>

      <td>
        ${item.method || ""}
      </td>

      <td class="pending">
        pending
      </td>

      <td>

        <button
          onclick="approveDeposit(
            '${item.id}',
            ${Number(item.amount)},
            '${item.user_id}'
          )">
          APPROVE
        </button>

        <button
          class="danger"
          onclick="rejectDeposit('${item.id}')">
          REJECT
        </button>

      </td>

    `;

    list.appendChild(tr);

  });
}


/* =========================
   APPROVE
========================= */

    alert(updateError.message);

    return;
  }

  const {data:profile,error:profileError} =
    await supabaseClient
      .from("profiles

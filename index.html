<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>KENO Gaming</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#070b12;
  color:#fff;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #263044;
}

.logo{
  font-size:30px;
  font-weight:bold;
  color:#36e38b;
}

.card{
  background:#111827;
  border:1px solid #263044;
  border-radius:16px;
  padding:18px;
  margin-top:18px;
}

.hidden{
  display:none!important;
}

input,
button{
  width:100%;
  padding:13px;
  margin:6px 0;
  border-radius:9px;
  border:1px solid #344054;
  font-size:15px;
}

input{
  background:#0b1220;
  color:#fff;
}

button{
  background:#20c878;
  color:#04120b;
  font-weight:bold;
  border:0;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#263044;
  color:#fff;
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.status{
  background:#182235;
  padding:10px;
  border-radius:8px;
  margin-top:8px;
  min-height:20px;
}

.success{
  color:#36e38b;
}

.error{
  color:#ff6b6b;
}

.small{
  color:#9ca3af;
  font-size:13px;
}

.balance-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.balance{
  font-size:30px;
  font-weight:bold;
  color:#36e38b;
}

.games-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

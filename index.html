<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KENO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#070b12;
  color:#fff;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 0;
  border-bottom:1px solid #263044;
}

.logo{
  font-size:32px;
  font-weight:bold;
  color:#36e38b;
}

.card{
  background:#111827;
  border:1px solid #263044;
  border-radius:16px;
  padding:20px;
  margin-top:20px;
}

h2{
  margin-top:0;
}

input,
select,
button{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #344054;
  font-size:16px;
}

input,
select{
  background:#0b1220;
  color:#fff;
}

button{
  background:#20c878;
  color:#04120b;
  font-weight:bold;
  border:0;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#263044;
  color:#fff;
}

.danger{
  background:#dc3545;
  color:#fff;
}

.hidden{
  display:none!important;
}

.row{
  display:flex;
  gap:10px;
}

.row>*{
  flex:1;
}

.status{
  padding:12px;
  border-radius:8px;
  background:#182235;
  margin-top:10px;
  min-height:20px;
  line-height:1.5;
}

.success{
  color:#36e38b;
}

.error{
  color:#ff6b6b;
}

.balance{
  font-size:32px;
  font-weight:bold;
  color:#36e38b;
}

.small{
  color:#9ca3af;
  font-size:13px;
}

.number-grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:7px;
  margin-top:15px;
}

.num{
  background:#182235;
  color:#fff;
  border:1px solid #344054;
  padding:10px 0;
}

.num.selected{
  background:#20c878;
  color:#06130b;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,
td{
  padding:10px 6px;
  border-bottom:1px solid #263044;
  text-align:left;
  font-size:13px;
}

.pending{
  color:#ffd166;
}

.approved{
  color:#36e38b;
}

.rejected{
  color:#ff6b6b;
}

@media(max-width:600px){

  .container{
    padding:14px;
  }

  .row{
    flex-direction:column;
  }

  .number-grid{
    grid-template-columns:repeat(8,1fr);
  }

  .num{
    padding:9px 0;
  }

}

</style>
</head>

<body>

<div class="container">

<header>

  <div class="logo">
    KENO
  </div>

  <button
    id="logoutBtn"
    class="secondary hidden"
    onclick="logout()">
    Logout
  </button>

</header>


<!-- =========================
     AUTH
========================= -->

<div id="authBox" class="card">

  <h2>Login / Register</h2>

  <input
    id="email"
    type="email"
    placeholder="Email"
    autocomplete="email">

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password">

  <div class="row">

    <button
      id="loginBtn"
      onclick="login()">
      Login
    </button>

    <button
      id="registerBtn"
      class="secondary"
      onclick="register()">
      Register
    </button>

  </div>

  <div
    id="authMessage"
    class="status">
  </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">


  <!-- BALANCE -->

  <div class="card">

    <div class="small">
      Your Balance
    </div>

    <div
      class="balance"
      id="balance">
      0.00 ETB
    </div>

  </div>


  <!-- =========================
       DEPOSIT
  ========================= -->

  <div class="card">

    <h2>
      Deposit
    </h2>

    <input
      id="depositAmount"
      type="number"
      min="1"
      placeholder="Amount (ETB)">

    <select id="depositMethod">

      <option value="Telebirr">
        Telebirr
      </option>

      <option value="CBE Birr">
        CBE Birr
      </option>

      <option value="Bank">
        Bank
      </option>

    </select>

    <input
      id="depositReference"
      placeholder="Transaction / Reference number">

    <button onclick="makeDeposit()">
      Submit Deposit
    </button>

    <div
      id="depositMessage"
      class="status">
    </div>

  </div>


  <!-- =========================
       DEPOSIT HISTORY
  ========================= -->

  <div class="card">

    <h2>
      My Deposits
    </h2>

    <table>

      <thead>

        <tr>
          <th>Amount</th>
          <th>Method</th>
          <th>Status</th>
        </tr>

      </thead>

      <tbody id="depositList">
      </tbody>

    </table>

  </div>


  <!-- =========================
       KENO
  ========================= -->

  <div class="card">

    <h2>
      KENO
    </h2>

    <div class="small">
      Select up to 10 numbers
    </div>

    <div
      id="numberGrid"
      class="number-grid">
    </div>

    <div
      class="row"
      style="margin-top:15px">

      <input
        id="betAmount"
        type="number"
        min="1"
        placeholder="Bet amount">

      <button
        id="playBtn"
        onclick="playKeno()">

        PLAY

      </button>

    </div>

    <div
      id="gameMessage"
      class="status">
    </div>

  </div>


  <!-- =========================
       ADMIN
  ========================= -->

  <div
    id="adminPanel"
    class="card hidden">

    <h2>
      Admin Panel
    </h2>

    <div class="small">
      Pending deposits
    </div>

    <table>

      <thead>

        <tr>
          <th>User</th>
          <th>Amount</th>
          <th>Method</th>
          <th>Status</th>
          <th>Action</th>
        </tr>

      </thead>

      <tbody id="adminDeposits">
      </tbody>

    </table>

  </div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://eizpxgwkottliyvvhlar.supabase.co";

const SUPABASE_KEY =
"sb_publishable_8ETbP5HwW3wZmWjlQQQu0Q_IMBPdfl7";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;

let selectedNumbers = [];

let isDrawing = false;


/* =====================================================
   MESSAGE
===================================================== */

function show(id,message,type=""){

  const element =
    document.getElementById(id);

  if(!element){
    return;
  }

  element.textContent = message;

  element.className =
    "status " + type;
}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!email){

    show(
      "authMessage",
      "Please enter your email.",
      "error"
    );

    return;
  }

  if(!password){

    show(
      "authMessage",
      "Please enter your password.",
      "error"
    );

    return;
  }

  if(password.length < 6){

    show(
      "authMessage",
      "Password must be at least 6 characters.",
      "error"
    );

    return;
  }

  const button =
    document.getElementById("registerBtn");

  button.disabled = true;

  show(
    "authMessage",
    "Creating account..."
  );

  try{

    const {data,error} =
      await supabaseClient.auth.signUp({
        email:email,
        password:password
      });

    if(error){

      show(
        "authMessage",
        "Registration error: " +
        error.message,
        "error"
      );

      return;
    }

    if(data.user){

      show(
        "authMessage",
        "Registration successful. You can now login.",
        "success"
      );

    }else{

      show(
        "authMessage",
        "Registration completed. Check your email if required.",
        "success"
      );

    }

  }catch(error){

    show(
      "authMessage",
      "Error: " + error.message,
      "error"
    );

  }finally{

    button.disabled = false;

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  if(!email){

    show(
      "authMessage",
      "Please enter your email.",
      "error"
    );

    return;
  }

  if(!password){

    show(
      "authMessage",
      "Please enter your password.",
      "error"
    );

    return;
  }

  const button =
    document.getElementById("loginBtn");

  button.disabled = true;

  show(
    "authMessage",
    "Logging in..."
  );

  try{

    const {data,error} =
      await supabaseClient.auth.signInWithPassword({

        email:email,

        password:password

      });

    if(error){

      show(
        "authMessage",
        "Login error: " +
        error.message,
        "error"
      );

      return;
    }

    if(!data.session){

      show(
        "authMessage",
        "Login failed: no session was created.",
        "error"
      );

      return;
    }

    currentUser =
      data.user;

    show(
      "authMessage",
      "Login successful.",
      "success"
    );

    await startApp();

  }catch(error){

    show(
      "authMessage",
      "Login error: " +
      error.message,
      "error"
    );

  }finally{

    button.disabled = false;

  }

}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  try{

    await supabaseClient.auth.signOut();

  }catch(error){

    console.log(error);

  }

  currentUser = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("authBox")
    .classList.remove("hidden");

  document
    .getElementById("logoutBtn")
    .classList.add("hidden");

  document
    .getElementById("authMessage")
    .textContent = "";

}


/* =====================================================
   START APP
===================================================== */

async function startApp(){

  document
    .getElementById("authBox")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("logoutBtn")
    .classList.remove("hidden");

  createNumbers();

  await loadBalance();

  await loadDeposits();

  await checkAdmin();

}


/* =====================================================
   BALANCE
===================================================== */

async function loadBalance(){

  if(!currentUser){
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){

    console.log(
      "Balance error:",
      error
    );

    document
      .getElementById("balance")
      .textContent =
      "0.00 ETB";

    return;
  }

  const balance =
    Number(data?.balance || 0);

  document
    .getElementById("balance")
    .textContent =
    balance.toFixed(2) +
    " ETB";

}


/* =====================================================
   DEPOSIT
===================================================== */

async function makeDeposit(){

  if(!currentUser){

    show(
      "depositMessage",
      "Please login first.",
      "error"
    );

    return;
  }

  const amount =
    Number(
      document
        .getElementById("depositAmount")
        .value
    );

  const method =
    document
      .getElementById("depositMethod")
      .value;

  const reference =
    document
      .getElementById("depositReference")
      .value
      .trim();

  if(!amount || amount <= 0){

    show(
      "depositMessage",
      "Enter a valid amount.",
      "error"
    );

    return;
  }

  if(!reference){

    show(
      "depositMessage",
      "Enter transaction reference.",
      "error"
    );

    return;
  }

  show(
    "depositMessage",
    "Submitting deposit..."
  );

  const {error} =
    await supabaseClient
      .from("deposits")
      .insert({

        user_id:currentUser.id,

        amount:amount,

        method:method,

        reference:reference,

        status:"pending"

      });

  if(error){

    show(
      "depositMessage",
      "Deposit error: " +
      error.message,
      "error"
    );

    return;
  }

  show(
    "depositMessage",
    "Deposit submitted successfully. Waiting for admin approval.",
    "success"
  );

  document
    .getElementById("depositAmount")
    .value = "";

  document
    .getElementById("depositReference")
    .value = "";

  await loadDeposits();

}


/* =====================================================
   LOAD DEPOSITS
===================================================== */

async function loadDeposits(){

  if(!currentUser){
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("deposits")
      .select("*")
      .eq("user_id",currentUser.id)
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.log(
      "Deposit history error:",
      error
    );

    return;
  }

  const list =
    document.getElementById(
      "depositList"
    );

  list.innerHTML = "";

  (data || []).forEach(item=>{

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        ${Number(item.amount).toFixed(2)} ETB
      </td>

      <td>
        ${item.method || ""}
      </td>

      <td class="${item.status || ""}">
        ${item.status || "pending"}
      </td>

    `;

    list.appendChild(tr);

  });

}


/* =====================================================
   ADMIN CHECK
===================================================== */

async function checkAdmin(){

  if(!currentUser){
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(error){

    console.log(
      "Admin check:",
      error
    );

    return;
  }

  if(data?.role === "admin"){

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");

    await loadAdminDeposits();

  }

}


/* =====================================================
   ADMIN DEPOSITS
===================================================== */

async function loadAdminDeposits(){

  const {data,error} =
    await supabaseClient
      .from("deposits")
      .select("*")
      .eq("status","pending")
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    console.log(
      "Admin deposits error:",
      error
    );

    return;
  }

  const list =
    document.getElementById(
      "adminDeposits"
    );

  list.innerHTML = "";

  (data || []).forEach(item=>{

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        ${item.user_id}
      </td>

      <td>
        ${Number(item.amount).toFixed(2)} ETB
      </td>

      <td>
        ${item.method || ""}
      </td>

      <td class="pending">
        pending
      </td>

      <td>

        <button
          onclick="approveDeposit(
            '${item.id}',
            ${Number(item.amount)},
            '${item.user_id}'
          )">

          APPROVE

        </button>

        <button
          class="danger"
          onclick="rejectDeposit('${item.id}')">

          REJECT

        </button>

      </td>

    `;

    list.appendChild(tr);

  });

}


/* =====================================================
   APPROVE DEPOSIT
===================================================== */

async function approveDeposit(
  depositId,
  amount,
  userId
){

  const {error:updateError} =
    await supabaseClient
      .from("deposits")
      .update({
        status:"approved"
      })
      .eq("id",depositId);

  if(updateError){

    alert(
      updateError.message
    );

    return;
  }

  const {data:profile,error:profileError} =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id",userId)
      .single();

  if(profileError){

    alert(
      profileError.message
    );

    return;
  }

  const newBalance =
    Number(profile.balance || 0) +
    Number(amount);

  const {error:balanceError} =
    await supabaseClient
      .from("profiles")
      .update({
        balance:newBalance
      })
      .eq("id",userId);

  if(balanceError){

    alert(
      balanceError.message
    );

    return;
  }

  alert(
    "Deposit approved successfully."
  );

  await loadAdminDeposits();

}


/* =====================================================
   REJECT DEPOSIT
===================================================== */

async function rejectDeposit(id){

  if(!confirm(
    "Reject this deposit?"
  )){
    return;
  }

  const {error} =
    await supabaseClient
      .from("deposits")
      .update({
        status:"rejected"
      })
      .eq("id",id);

  if(error){

    alert(
      error.message
    );

    return;
  }

  alert(
    "Deposit rejected."
  );

  await loadAdminDeposits();

}


/* =====================================================
   KENO NUMBERS
===================================================== */

function createNumbers(){

  const grid =
    document.getElementById(
      "numberGrid"
    );

  grid.innerHTML = "";

  selectedNumbers = [];

  for(let i=1;i<=80;i++){

    const button =
      document.createElement(
        "button"
      );

    button.className = "num";

    button.textContent = i;

    button.onclick = ()=>{

      if(isDrawing){
        return;
      }

      if(
        selectedNumbers.includes(i)
      ){

        selectedNumbers =
          selectedNumbers.filter(
            n => n !== i
          );

        button.classList.remove(
          "selected"
        );

      }else{

        if(
          selectedNumbers.length >= 10
        ){

          alert(
            "Maximum 10 numbers."
          );

          return;
        }

        selectedNumbers.push(i);

        button.classList.add(
          "selected"
        );

      }

    };

    grid.appendChild(button);

  }

}


/* =====================================================
   KENO
===================================================== */

async function playKeno(){

  if(isDrawing){
    return;
  }

  if(!currentUser){

    show(
      "gameMessage",
      "Please login first.",
      "error"
    );

    return;
  }

  const bet =
    Number(
      document
        .getElementById("betAmount")
        .value
    );

  if(!bet || bet <= 0){

    show(
      "gameMessage",
      "Enter bet amount.",
      "error"
    );

    return;
  }

  if(
    selectedNumbers.length < 1
  ){

    show(
      "gameMessage",
      "Select at least one number.",
      "error"
    );

    return;
  }

  const {data:profile,error} =
    await supabaseClient
      .from("profiles")
      .select("balance")
      .eq("id",currentUser.id)
      .single();

  if(error){

    show(
      "gameMessage",
      "Balance error: " +
      error.message,
      "error"
    );

    return;
  }

  const balance =
    Number(profile.balance || 0);

  if(balance < bet){

    show(
      "gameMessage",
      "Insufficient balance.",
      "error"
    );

    return;
  }

  isDrawing = true;

  document
    .getElementById("playBtn")
    .disabled = true;

  show(
    "gameMessage",
    "🎰 DRAWING..."
  );

  const winningNumbers = [];

  while(
    winningNumbers.length < 10
  ){

    const n =
      Math.floor(
        Math.random() * 80
      ) + 1;

    if(
      !winningNumbers.includes(n)
    ){

      winningNumbers.push(n);

    }

  }

  for(
    let i=0;
    i<winningNumbers.length;
    i++
  ){

    show(
      "gameMessage",
      "🎱 Drawing number " +
      (i+1) +
      "/10..."
    );

    await wait(700);

    show(
      "gameMessage",
      "🎱 Number: " +
      winningNumbers[i]
    );

    await wait(400);

  }

  const hits =
    selectedNumbers.filter(
      n => winningNumbers.includes(n)
    ).length;


  const multipliers = {

    0:0,
    1:0,
    2:1,
    3:2,
    4:5,
    5:10,
    6:20,
    7:50,
    8:100,
    9:250,
    10:500

  };


  const multiplier =
    multipliers[hits] || 0;

  const payout =
    bet * multiplier;

  const finalBalance =
    balance - bet + payout;


  const {error:balanceError} =
    await supabaseClient
      .from("profiles")
      .update({
        balance:finalBalance
      })
      .eq("id",currentUser.id);

  if(balanceError){

    show(
      "gameMessage",
      "Balance update error: " +
      balanceError.message,
      "error"
    );

    isDrawing = false;

    document
      .getElementById("playBtn")
      .disabled = false;

    return;
  }


  show(
    "gameMessage",

    "🏆 Winning Numbers: " +
    winningNumbers.join(", ") +

    " | Hits: " +
    hits +

    " | Payout: " +
    payout.toFixed(2) +
    " ETB",

    "success"
  );


  await loadBalance();


  isDrawing = false;

  document
    .getElementById("playBtn")
    .disabled = false;

}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );

}


/* =====================================================
   AUTO LOGIN
===================================================== */

(async function(){

  try{

    const {data,error} =
      await supabaseClient.auth.getSession();

    if(error){

      console.log(
        "Session error:",
        error
      );

      return;
    }

    if(data.session){

      currentUser =
        data.session.user;

      await startApp();

    }

  }catch(error){

    console.log(
      "Startup error:",
      error
    );

  }

})();


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  async(event,session)=>{

    console.log(
      "Auth event:",
      event
    );

    if(
      event === "SIGNED_OUT"
    ){

      currentUser = null;

    }

  }
);

</script>

</body>
</html>
